[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gist"
version = "2.0.0"
description = "扔视频链接，AI自动分析、总结拆解、提取可复用知识"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "openai-whisper",
    "torch",
    "funasr",
]

[project.scripts]
gist = "gist:main"
